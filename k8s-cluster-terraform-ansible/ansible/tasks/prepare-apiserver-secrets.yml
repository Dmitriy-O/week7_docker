---
- name: Create the ServiceAccount signing key
  community.crypto.openssl_privatekey:
    path: "{{ pki_dir }}/service-account.key"
    type: RSA
    size: 2048
    regenerate: fail
    mode: "0600"
  no_log: true

- name: Export the ServiceAccount public key
  community.crypto.openssl_publickey:
    path: "{{ pki_dir }}/service-account.pub"
    privatekey_path: "{{ pki_dir }}/service-account.key"
    mode: "0644"

- name: Check if the encryption configuration exists
  ansible.builtin.stat:
    path: "{{ pki_output_dir }}/encryption-config.yml"
  register: pki_encryption_config

- name: Create the initial Secrets encryption key and configuration
  when: not pki_encryption_config.stat.exists
  no_log: true
  block:
    - name: Generate 32 random bytes
      ansible.builtin.command:
        argv: [openssl, rand, -base64, "32"]
      register: pki_encryption_key
      changed_when: false

    - name: Write the encryption configuration
      ansible.builtin.copy:
        dest: "{{ pki_output_dir }}/encryption-config.yml"
        mode: "0600"
        force: false
        content: |
          apiVersion: apiserver.config.k8s.io/v1
          kind: EncryptionConfiguration
          resources:
            - resources: [secrets]
              providers:
                - aescbc:
                    keys:
                      - name: week10-key-1
                        secret: {{ pki_encryption_key.stdout | trim }}
                - identity: {}
