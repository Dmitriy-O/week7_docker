---
- name: Prepare the Kubernetes certificate authority locally
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    pki_dir: "{{ playbook_dir }}/../artifacts/pki"
    ca_common_name: "week10-kubernetes-ca"

  roles:
    - generate-certs
