{{- if and (eq .Values.workload "web") .Values.hooks.enabled }}
{{- range $hook := list "pre-install" "post-install" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" ($.Release.Name | trunc 49 | trimSuffix "-") $hook }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 150
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Chart.Name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: test
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: {{ include "healthchecks-common.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["python", "-c"]
          args:
            {{- if eq $hook "pre-install" }}
            - |
              import django
              print("Django import OK", django.get_version())
            {{- else }}
            - |
              import time
              import urllib.request

              url = "http://{{ $.Release.Name }}:{{ $.Values.service.port }}/health/ready/"
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          if response.status == 200:
                              print("Readiness check OK")
                              break
                  except OSError as error:
                      print(error, flush=True)
                  if attempt < 11:
                      time.sleep(5)
              else:
                  raise SystemExit("Healthchecks readiness endpoint did not return HTTP 200")
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
{{- end }}
{{- end }}
