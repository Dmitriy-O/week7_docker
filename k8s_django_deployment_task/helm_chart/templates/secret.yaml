{{- $secrets := .Values.secrets | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  DB_PASSWORD: {{ required "secrets.DB_PASSWORD must be provided" $secrets.DB_PASSWORD | b64enc | quote }}
  SECRET_KEY: {{ required "secrets.SECRET_KEY must be provided" $secrets.SECRET_KEY | b64enc | quote }}
