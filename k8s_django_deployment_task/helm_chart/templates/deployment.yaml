{{- if eq .Values.workload "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/database-ca: {{ include (print $.Template.BasePath "/database-ca.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      terminationGracePeriodSeconds: 40
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command: ["gunicorn"]
          args:
            - hc.wsgi:application
            - --bind=0.0.0.0:{{ .Values.containerPort }}
            - --workers=2
            - --access-logfile=-
            - --error-logfile=-

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets

          {{- if .Values.databaseTLS.enabled }}
          volumeMounts:
            - name: database-ca
              mountPath: /etc/rds-ca
              readOnly: true
          {{- end }}

          startupProbe:
            httpGet:
              path: /health/live/
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /health/live/
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready/
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      {{- if .Values.databaseTLS.enabled }}
      volumes:
        - name: database-ca
          configMap:
            name: {{ .Release.Name }}-db-ca
      {{- end }}
{{- end }}
