suite: Ingress rendering
templates:
  - templates/ingress.yaml

release:
  name: healthchecks
  namespace: healthchecks

tests:
  - it: renders no ingress when disabled
    set:
      ingress.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one ingress with the configured host and service when enabled
    set:
      ingress.enabled: true
      ingress.host: healthchecks.example.test
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].host
          value: healthchecks.example.test
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: healthchecks
