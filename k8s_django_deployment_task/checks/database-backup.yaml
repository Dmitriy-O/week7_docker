apiVersion: v1
kind: Pod
metadata:
  name: database-backup
  namespace: healthchecks
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: backup
      image: postgres:17
      command: ["sleep", "1800"]
      envFrom:
        - configMapRef:
            name: healthchecks-config
        - secretRef:
            name: healthchecks-secrets
      volumeMounts:
        - name: database-ca
          mountPath: /etc/rds-ca
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: database-ca
      configMap:
        name: healthchecks-db-ca
