fullnameOverride: traefik

deployment:
  replicas: 2

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

providers:
  kubernetesIngress:
    enabled: true
    nativeLBByDefault: true
    publishedService:
      enabled: true
  kubernetesGateway:
    enabled: false

gateway:
  enabled: false

ingressRoute:
  dashboard:
    enabled: false

service:
  spec:
    type: LoadBalancer
    loadBalancerClass: service.k8s.aws/nlb
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-name: "week8-healthchecks"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-07ca555e8157e5a2c,subnet-077d57e71c004387e"
    service.beta.kubernetes.io/aws-load-balancer-attributes: "load_balancing.cross_zone.enabled=true"
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Project=week8-healthchecks,Environment=lab"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
