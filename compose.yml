name: week6-healthchecks

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: hc
      POSTGRES_USER: hc
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: healthchecks:week6-task1
    build:
      context: .
      dockerfile: terraform-aws-ecs-fargate/Dockerfile
    environment:
      SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}"
      DEBUG: "False"
      DB: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: hc
      DB_USER: hc
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      SITE_ROOT: http://localhost:8000
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
